- texto: Posso escolher qualquer espaço vazio e considerá-lo um palco nu. Um homem atravessa este espaço vazio enquanto outro o observa, e isto é suficiente para criar uma ação cênica.
  autor: Peter Brook
  obra: O espaço vazio
- texto: O teatro é a poesia que se levanta do livro e se faz humana.
  autor: Federico García Lorca
  obra: ""
- texto: Somos feitos da mesma matéria dos sonhos.
  autor: William Shakespeare
  obra: A tempestade
- texto: Todo mundo atua, age, interpreta. Somos todos atores. Até mesmo os atores!
  autor: Augusto Boal
  obra: Jogos para atores e não-atores
- texto: Ame a arte em você, e não você na arte.
  autor: Constantin Stanislavski
  obra: ""
- texto: Todas as artes contribuem para a maior de todas as artes, a arte de viver.
  autor: Bertolt Brecht
  obra: ""
- texto: Considero o teatro a maior de todas as formas de arte, a maneira mais imediata pela qual um ser humano pode compartilhar com outro o sentido do que é ser humano.
  autor: Thornton Wilder
  obra: ""
- texto: O otimista é um tolo. O pessimista, um chato. Bom mesmo é ser um realista esperançoso.
  autor: Ariano Suassuna
  obra: ""
