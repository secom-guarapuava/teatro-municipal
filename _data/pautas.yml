texto_ao_longo_do_ano: Depois do credenciamento, as datas que sobram ficam
  abertas a pedidos ao longo do ano. Chame a Secretaria de Cultura no WhatsApp e
  envie um ofício para o e-mail da Cultura com a data que você quer. A resposta,
  deferindo ou não o pedido, chega pelo mesmo e-mail.
orientacoes_oficio: No ofício, informe o nome do grupo ou do proponente, a
  atividade, a data e o horário pretendidos e um telefone para contato.
